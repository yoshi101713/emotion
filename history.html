<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感情履歴</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      gap: 2rem;
      padding: 1rem;
      flex-wrap: wrap;
    }
    #historyList {
      list-style: disc;
      padding-left: 1rem;
      max-width: 500px;
    }
    #chartContainer {
      width: 500px;
      min-width: 300px;
    }
    button {
      background: #5b45ec;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    select {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div>
    <h2>感情履歴</h2>
    <label for="viewSelect">表示切替：</label>
    <select id="viewSelect">
      <option value="date">日別</option>
    </select>
    <ul id="historyList"></ul>
    <button onclick="window.location.href='main.html'">戻る</button>
  </div>

  <div id="chartContainer">
    <h2>感情分布グラフ</h2>
    <canvas id="emotionChart" height="300"></canvas>  <!-- グラフの高さを設定 -->
  </div>

  <script src="script.js"></script>
  <script>
    const emotionChartCanvas = document.getElementById('emotionChart');
    let emotionChart;

    // 初期表示（デフォルトで日別に設定）
    async function updateChart(view) {
      const historyList = document.getElementById('historyList');
      let data;

      // 日別履歴を取得
      if (view === 'date') {
        data = await loadDailyHistory();
        historyList.innerHTML = "日別の感情履歴";
      }

      if (data && data.labels) {
        // データをChart.jsに渡す形式に整形
        const formattedData = formatDataForChart(data);

        // チャートを作成
        const datasets = Object.keys(formattedData.seriesByEmotion || {}).map(emo => ({
          label: emo,
          data: formattedData.seriesByEmotion[emo],
          borderWidth: 2,
          fill: false
        }));

        // 既存のチャートがあれば破棄して新しいチャートを作成
        if (emotionChart) emotionChart.destroy();
        
        emotionChart = new Chart(emotionChartCanvas, {
          type: 'line',
          data: {
            labels: formattedData.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,  // y軸の最小値を0に設定
                min: 0,  // グラフが下に過剰に下がらないように最小値を0に設定
                title: { display: true, text: "件数" }
              },
              x: {
                title: { display: true, text: "日付" }
              }
            }
          }
        });
      }
    }

    // 初期表示を日別に設定
    updateChart('date');

    // 日別履歴を取得
    async function loadDailyHistory() {
      const u = getUser();
      const msg = $("#historyMessage") || $("#message");
      if (!u) { 
        if (msg) msg.textContent = "未ログインです。";
        return { labels: [], seriesByEmotion: {} }; 
      }

      try {
        // APIエンドポイントでデータを取得
        const url = `${historyApiUrl}?user=${encodeURIComponent(u)}&group=daily`;
        const { ok, data } = await getJSON(url);
        if (!ok) {
          if (msg) msg.textContent = (data && data.message) ? data.message : "履歴取得に失敗しました。";
          return { labels: [], seriesByEmotion: {} };
        }

        // データを正しい形式に整形する
        console.log('Daily Data:', data);  // レスポンスデータの確認
        return formatDataForChart(data);
      } catch (e) {
        if (msg) msg.textContent = "通信エラーが発生しました。";
        return { labels: [], seriesByEmotion: {} };
      }
    }

    // データをChart.js用に整形する
    function formatDataForChart(data) {
      const labels = data.labels || [];  // 日付
      const seriesByEmotion = {};

      // `seriesByEmotion` がオブジェクトの場合、Object.keys() を使って反復処理
      Object.keys(data.seriesByEmotion).forEach(emotion => {
        const count = data.seriesByEmotion[emotion] || 0; // 感情のカウント

        // 感情ごとのデータを`seriesByEmotion`に追加
        if (!seriesByEmotion[emotion]) {
          seriesByEmotion[emotion] = [];
        }

        seriesByEmotion[emotion].push(count);  // 感情ごとのデータを追加
      });

      return { labels, seriesByEmotion };
    }

    // ユーザーを取得
    function getUser() {
      return localStorage.getItem("user") || "";
    }

    // APIからデータを取得（GETメソッド）
    async function getJSON(url) {
      const res = await fetch(url, { method: "GET" });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }
  </script>
</body>
</html>
