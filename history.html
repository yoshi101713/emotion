<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感情履歴</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h3 {
            color: #333;
        }
        #emotion-history ul {
            list-style-type: none;
            padding-left: 0;
        }
        #emotion-history li {
            padding: 10px;
            margin: 5px 0;
            border-left: 5px solid;
            font-size: 16px;
        }
        canvas {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>感情履歴</h1>

    <!-- 感情履歴表示 -->
    <div id="emotion-history"></div>

    <!-- グラフ表示エリア -->
    <div>
        <canvas id="emotionChart"></canvas>
    </div>

    <script src="script.js"></script>
    <script>
        // ここで感情履歴を取得し、グラフを描画する
        const historyContainer = document.getElementById("emotion-history");

        // 日別履歴をグラフ表示
        function displayEmotionHistory(data) {
            if (!data || data.length === 0) {
                historyContainer.innerHTML = "<p>まだ感情履歴はありません。</p>";
                return;
            }

            historyContainer.innerHTML = "<h3>感情履歴</h3>";
            const historyList = document.createElement("ul");

            const emotionCounts = {
                "喜び": 0,
                "怒り": 0,
                "悲しみ": 0,
                "恐れ": 0,
                "驚き": 0,
                "疲労": 0,
                "リラックス": 0
            };

            data.forEach(entry => {
                const listItem = document.createElement("li");
                listItem.style.color = colorMap[entry.emotion];
                listItem.textContent = `${entry.timestamp}: ${entry.emotion}`;
                historyList.appendChild(listItem);

                // 感情カウント
                emotionCounts[entry.emotion]++;
            });

            historyContainer.appendChild(historyList);

            // グラフ表示
            const labels = Object.keys(emotionCounts);
            const counts = Object.values(emotionCounts);

            const ctx = document.getElementById('emotionChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '感情のカウント',
                        data: counts,
                        backgroundColor: Object.values(colorMap),
                        borderColor: Object.values(colorMap),
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
