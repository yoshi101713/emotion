<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>感情履歴</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; gap: 2rem; padding: 1rem; flex-wrap: wrap; }
    #historyList { list-style: disc; padding-left: 1rem; max-width: 500px; }
    #chartContainer { width: 500px; min-width: 300px; }
    button { background: #5b45ec; color: white; padding: 0.5rem 1rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
    select { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div>
    <h2>感情履歴</h2>
    <label for="viewSelect">表示切替：</label>
    <select id="viewSelect">
      <option value="date">日別</option>
      <option value="weekday">曜日別</option>
    </select>
    <ul id="historyList"></ul>
    <button onclick="window.location.href='main.html'">戻る</button>
  </div>

  <div id="chartContainer">
    <h2>感情分布グラフ</h2>
    <canvas id="emotionChart"></canvas>
  </div>

  <script src="script.js"></script>
  <script>
    // 変数の宣言
    const emotionChartCanvas = document.getElementById('emotionChart');
    let emotionChart;

    // 表示切り替え処理
    document.getElementById('viewSelect').addEventListener('change', (event) => {
      const selectedView = event.target.value;
      updateChart(selectedView);
    });

    // 初期表示
    async function updateChart(view) {
      const historyList = document.getElementById('historyList');
      let data;

      // 日別の場合
      if (view === 'date') {
        data = await loadDailyHistory();
        historyList.innerHTML = "日別の感情履歴";
      } 
      // 曜日別の場合
      else if (view === 'weekday') {
        data = await loadWeekdayHistory();
        historyList.innerHTML = "曜日別の感情履歴";
      }

      if (data && data.labels) {
        // チャートを作成
        const datasets = Object.keys(data.seriesByEmotion || {}).map(emo => ({
          label: emo,
          data: data.seriesByEmotion[emo],
          borderWidth: 2,
          fill: false
        }));

        // 既存のチャートがあれば破棄して新しいチャートを作成
        if (emotionChart) emotionChart.destroy();
        
        emotionChart = new Chart(emotionChartCanvas, {
          type: 'line',
          data: {
            labels: data.labels,
            datasets: datasets
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    // 初期表示を日別に設定
    updateChart('date');

    // 日別履歴を取得
    async function loadDailyHistory() {
      const response = await fetch('https://example.com/daily-history?user=津久井浜');
      const data = await response.json();
      return data;  // 期待する形式でデータを返す
    }

    // 曜日別履歴を取得
    async function loadWeekdayHistory() {
      const response = await fetch('https://example.com/weekday-history?user=津久井浜');
      const data = await response.json();
      return data;  // 期待する形式でデータを返す
    }
  </script>
</body>
</html>
