<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>感情履歴</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; gap: 2rem; padding: 1rem; flex-wrap: wrap; }
    #historyList { list-style: disc; padding-left: 1rem; max-width: 520px; }
    #chartContainer { width: 520px; min-width: 320px; height: 360px; }
    button { background: #5b45ec; color: white; padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; margin-top: 1rem; }
    select { margin-bottom: 1rem; }
    h2 { margin: 0.4rem 0 0.8rem; }
  </style>
</head>
<body>
  <div>
    <h2>感情履歴</h2>
    <label for="viewSelect">表示切替：</label>
    <select id="viewSelect">
      <option value="date">日別</option>
      <option value="weekday">曜日別</option>
    </select>
    <ul id="historyList"></ul>
    <button onclick="window.location.href='main.html'">戻る</button>
  </div>

  <div id="chartContainer">
    <h2>感情分布グラフ</h2>
    <canvas id="emotionChart"></canvas>
  </div>

  <!-- 共通ロジック（API呼び出し・集計など） -->
  <script src="script.js"></script>

  <!-- ページ固有：日別=詳細 / 曜日別=サマリー -->
  <script>
    const sel  = document.getElementById("viewSelect");
    const list = document.getElementById("historyList");
    const ctx  = document.getElementById("emotionChart").getContext("2d");
    let chart;

    document.addEventListener("DOMContentLoaded", refresh);
    sel.addEventListener("change", refresh);

    async function refresh(){
      const user = localStorage.getItem("user");
      if (!user) {
        list.innerHTML = "<li>未ログインです。index.html からログインしてください。</li>";
        drawChart({labels:[], seriesByEmotion:{}}, "daily");
        return;
      }

      const mode = (sel.value === "weekday") ? "weekday" : "daily";
      // 生配列（[{timestamp, emotion, user}, ...]）を取得
      const { ok, data: raw } = await getJSON(`${historyApiUrl}?user=${encodeURIComponent(user)}`);
      if (!ok || !Array.isArray(raw)) {
        list.innerHTML = "<li>履歴の取得に失敗しました</li>";
        drawChart({labels:[], seriesByEmotion:{}}, mode);
        return;
      }

      // 左側リスト：日別は詳細、曜日別はサマリー
      if (mode === "daily") {
        renderListDailyDetail(raw);
      } else {
        renderListWeekdaySummary(raw);
      }

      // グラフ：script.js の aggregateHistory で集計して描画
      const agg = aggregateHistory(raw, mode);
      drawChart(agg, mode);
    }

    // === 日別：詳細（各日の下に HH:MM:SS + 感情を列挙） ===
    function renderListDailyDetail(raw){
      const grouped = {};
      raw.forEach(it => {
        const d = new Date(it.timestamp);
        if (isNaN(d.getTime())) return;
        const key = d.toISOString().slice(0,10); // YYYY-MM-DD
        (grouped[key] ||= []).push(it);
      });

      const keys = Object.keys(grouped).sort(); // 昇順
      list.innerHTML = "";
      keys.forEach(k => {
        const arr = grouped[k].sort((a,b) => a.timestamp.localeCompare(b.timestamp));
        const total = arr.length;

        const li = document.createElement("li");
        const inner = arr
          .map(it => `${formatTime(it.timestamp)}　${it.emotion}`)
          .map(s => `<li>${s}</li>`).join("");
        li.innerHTML = `<strong>${k}：${total}件</strong><ul>${inner}</ul>`;
        list.appendChild(li);
      });
    }

    // === 曜日別：サマリー（各曜日の合計件数だけ） ===
    function renderListWeekdaySummary(raw){
      const wd = ["日","月","火","水","木","金","土"];
      const counts = Object.fromEntries(wd.map(w => [w, 0]));

      raw.forEach(it => {
        const d = new Date(it.timestamp);
        if (isNaN(d.getTime())) return;
        counts[wd[d.getDay()]]++;
      });

      list.innerHTML = "";
      wd.forEach(w => {
        if (counts[w] > 0) {
          const li = document.createElement("li");
          li.textContent = `${w}：${counts[w]}件`;
          list.appendChild(li);
        }
      });
    }

    function formatTime(ts){
      const d = new Date(ts);
      const pad = n => String(n).padStart(2,"0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // === グラフ描画（従来どおり） ===
    function drawChart(data, mode){
      const labels = data.labels || [];
      const emotions = Object.keys(window.colorMap || {});
      const datasets = emotions.map(emotion => ({
        label: emotion,
        backgroundColor: window.colorMap[emotion],
        data: (data.seriesByEmotion && data.seriesByEmotion[emotion])
                ? data.seriesByEmotion[emotion]
                : Array(labels.length).fill(0)
      }));

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, min: 0, title: { display: true, text: "件数" } },
            x: { title: { display: true, text: (mode === "weekday") ? "曜日" : "日付" } }
          },
          plugins: {
            legend: { position: "bottom" },
            title: { display: true, text: (mode === "weekday") ? "曜日別感情分布" : "日別感情分布" }
          }
        }
      });
    }
  </script>
</body>
</html>
