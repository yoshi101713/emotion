<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>感情履歴</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --space: 1rem;
      --radius: 12px;
      --primary: #5b45ec;
      --muted: #f4f4f7;
      --text: #222;
      --ghost: #eee;
    }
    *{box-sizing:border-box}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--text);
      margin:0;
      background:#fff;
    }

    /* ===== ページレイアウト ===== */
    .page{
      display:flex; gap:2rem; padding:var(--space); flex-wrap:wrap;
      align-items:flex-start;
    }
    .panel{
      background:#fff;
      border-radius: var(--radius);
    }

    /* 左カラム（フィルタ + リスト） */
    .left{
      flex:1 1 420px; min-width:280px; max-width:640px;
    }
    .right{
      flex:1 1 420px; min-width:280px; max-width:640px;
    }

    h2{ margin: .4rem 0 .6rem; }

    /* ===== コントロール群（スマホで固定） ===== */
    .sticky-controls{
      position: sticky; top: 0;
      background: #fff;
      padding-bottom: .5rem;
      z-index: 10;
      border-bottom: 1px solid #eee;
    }

    .row{ display:flex; gap:.5rem; align-items:end; flex-wrap:wrap; }
    .field{ display:grid; gap:.25rem; }
    input[type="date"]{
      padding:.6rem .7rem; font-size:16px; /* 16pxでズーム抑止 */
      border:1px solid #ccc; border-radius:8px; min-height:44px;
    }

    button{
      background: var(--primary); color:#fff; padding:.7rem .9rem;
      border:none; border-radius:8px; cursor:pointer; min-height:44px;
      font-size:16px;
    }
    button.ghost{ background: var(--ghost); color:#333; }

    /* クイック期間は横スクロール可（スマホ快適） */
    .quickbar{
      display:flex; gap:.5rem; padding:.4rem 0 .2rem;
      overflow-x:auto; -webkit-overflow-scrolling: touch;
    }
    .quickbar > button{ flex:0 0 auto; }

    /* ===== 感情フィルタ（レスポンシブグリッド） ===== */
    .chipbar{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .chips{
      display:grid; gap:.4rem; margin:.4rem 0 .2rem; width:100%;
      grid-template-columns: repeat(2, minmax(120px,1fr)); /* 既定：2列 */
      max-width: 560px;
    }
    @media (min-width: 480px){
      .chips{ grid-template-columns: repeat(3, minmax(110px,1fr)); } /* 横広では3列 */
    }
    @media (min-width: 760px){
      .chips{ grid-template-columns: repeat(4, minmax(110px,1fr)); } /* タブレットで4列 */
    }
    .chip{
      padding:.55rem .7rem; border-radius:999px; font-size:.95rem; line-height:1;
      border:1px solid #ccc; background:#f7f7f7; color:#333; cursor:pointer; user-select:none;
      display:flex; align-items:center; justify-content:center; min-height:40px;
      transition:transform .02s ease-in;
    }
    .chip:active{ transform: scale(.98); }
    .chip.active{ border-color:var(--primary); box-shadow: inset 0 0 0 9999px rgba(91,69,236,.12); }
    .chip .swatch{ display:inline-block; width:.9em; height:.9em; border-radius:50%; margin-right:.35em; }

    /* ===== リスト ===== */
    #historyList{ padding-left:1rem; margin: .5rem 0 0; }
    #historyList > li{ margin:.4rem 0; }

    /* 折りたたみ：スマホでは日ごと明細をデフォ閉じ */
    details{ background: var(--muted); border-radius:8px; padding:.4rem .6rem; }
    details > summary{
      list-style:none; cursor:pointer; font-weight:600;
      display:flex; align-items:center; gap:.4rem;
    }
    details > summary::-webkit-details-marker{ display:none; }
    .caret{ transform: rotate(0deg); transition: transform .15s ease; }
    details[open] .caret{ transform: rotate(90deg); }
    .list-inner{ padding:.2rem 0 .3rem .2rem; }

    /* ===== グラフ ===== */
    #chartContainer{
      height: 420px; /* PC */
      display:flex; flex-direction:column;
    }
    @media (max-width: 768px){
      /* スマホでは縦積み・グラフをコンパクトに */
      .page{ flex-direction:column; gap:1rem; }
      #chartContainer{ height: 300px; }
    }
    #chartActions{ text-align:center; margin-top:.5rem; }
  </style>
</head>
<body>
  <div class="page">
    <!-- 左：フィルタ & リスト -->
    <section class="left panel">
      <h2>感情履歴</h2>

      <div class="sticky-controls" aria-label="フィルタ">
        <!-- 日付フィルタ -->
        <div class="row" style="margin-top:.25rem;">
          <div class="field">
            <label for="startDate">開始日</label>
            <input id="startDate" type="date" aria-label="開始日">
          </div>
          <div class="field">
            <label for="endDate">終了日</label>
            <input id="endDate" type="date" aria-label="終了日">
          </div>
          <div class="field">
            <button id="applyBtn" aria-label="日付を適用">適用</button>
          </div>
          <div class="field">
            <button id="clearBtn" class="ghost" aria-label="日付をクリア">クリア</button>
          </div>
        </div>

        <!-- クイック期間（横スクロール可） -->
        <div class="quickbar" role="toolbar" aria-label="クイック期間">
          <button class="ghost" data-range="today">今日</button>
          <button class="ghost" data-range="this_week">今週</button>
          <button class="ghost" data-range="this_month">今月</button>
          <button class="ghost" data-range="last_30">直近30日</button>
        </div>

        <!-- 感情フィルタ（レスポンシブ列数） -->
        <div class="chipbar" aria-label="感情フィルタ">
          <div id="emotionChips" class="chips"></div>
          <div style="display:flex; gap:.4rem;">
            <button id="selectAll" class="ghost">全選択</button>
            <button id="clearAll" class="ghost">全解除</button>
          </div>
        </div>

        <!-- 表示切替 -->
        <div class="row" style="align-items:center; margin-top:.2rem;">
          <label for="viewSelect">表示切替：</label>
          <select id="viewSelect" aria-label="表示切替">
            <option value="date">日別</option>
            <option value="weekday">曜日別</option>
          </select>
        </div>
      </div>

      <!-- 日付ごとの詳細リスト（モバイルは折りたたみ） -->
      <ul id="historyList"></ul>
    </section>

    <!-- 右：グラフ -->
    <section class="right panel">
      <h2>感情分布グラフ</h2>
      <div id="chartContainer">
        <canvas id="emotionChart" aria-label="感情分布グラフ"></canvas>
        <div id="chartActions">
          <button onclick="window.location.href='main.html'">戻る</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 共通ロジック（getJSON, aggregateHistory, colorMap, historyApiUrl など） -->
  <script src="script.js"></script>

  <script>
    const sel  = document.getElementById("viewSelect");
    const list = document.getElementById("historyList");
    const ctx  = document.getElementById("emotionChart").getContext("2d");
    const startDateEl = document.getElementById("startDate");
    const endDateEl   = document.getElementById("endDate");
    const applyBtn    = document.getElementById("applyBtn");
    const clearBtn    = document.getElementById("clearBtn");

    const chipsWrap   = document.getElementById("emotionChips");
    const btnAll      = document.getElementById("selectAll");
    const btnNone     = document.getElementById("clearAll");

    const quickBar    = document.querySelector(".quickbar");

    let rawAll = [];            // 取得した全履歴
    let selected = new Set();   // 選択中の感情
    let chart;

    // UI順
    const EMOTIONS = ["喜び","怒り","悲しみ","恐れ","驚き","疲労","リラックス"];

    document.addEventListener("DOMContentLoaded", init);
    sel.addEventListener("change", refresh);
    applyBtn.addEventListener("click", refresh);
    clearBtn.addEventListener("click", () => {
      startDateEl.value = ""; endDateEl.value = ""; refresh();
    });

    // クイック期間
    quickBar.addEventListener("click", (e)=>{
      const btn = e.target.closest("button[data-range]");
      if (!btn) return;
      setQuickRange(btn.dataset.range);
      refresh();
    });

    btnAll.addEventListener("click", () => { selected = new Set(EMOTIONS); syncChips(); refresh(); });
    btnNone.addEventListener("click", () => { selected.clear(); syncChips(); refresh(); });

    async function init(){
      buildEmotionChips();

      const user = localStorage.getItem("user");
      if (!user) {
        list.innerHTML = "<li>未ログインです。index.html からログインしてください。</li>";
        drawChart({labels:[], seriesByEmotion:{}}, "daily");
        return;
      }
      const { ok, data } = await getJSON(`${historyApiUrl}?user=${encodeURIComponent(user)}`);
      rawAll = ok && Array.isArray(data) ? data : [];

      // 初期は直近30日 & 全感情
      setQuickRange("last_30");
      selected = new Set(EMOTIONS);
      syncChips();

      refresh();
    }

    function buildEmotionChips(){
      chipsWrap.innerHTML = "";
      EMOTIONS.forEach(e => {
        const color = (window.colorMap && window.colorMap[e]) || "#ccc";
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.emotion = e;
        chip.innerHTML = `<span class="swatch" style="background:${color}"></span>${e}`;
        chip.setAttribute("aria-pressed","true");
        chip.addEventListener("click", () => {
          const isOn = selected.has(e);
          if (isOn) selected.delete(e); else selected.add(e);
          chip.classList.toggle("active", selected.has(e));
          chip.setAttribute("aria-pressed", String(selected.has(e)));
          refresh();
        });
        chipsWrap.appendChild(chip);
      });
    }

    function syncChips(){
      [...chipsWrap.querySelectorAll(".chip")].forEach(el => {
        const on = selected.has(el.dataset.emotion);
        el.classList.toggle("active", on);
        el.setAttribute("aria-pressed", String(on));
      });
    }

    /* ====== クイック期間 ====== */
    function toYmd(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; }
    function todayJST(){ return new Date(); }
    function setQuickRange(kind){
      const now = todayJST();
      if (kind === "today"){
        const s = toYmd(now); startDateEl.value = s; endDateEl.value = s; return;
      }
      if (kind === "this_week"){
        const d = new Date(now);
        const day = d.getDay();          // 0:日〜6:土
        const diffToMon = (day + 6) % 7; // 月=0
        const start = new Date(d); start.setDate(d.getDate() - diffToMon);
        const end   = new Date(start); end.setDate(start.getDate() + 6);
        startDateEl.value = toYmd(start); endDateEl.value = toYmd(end); return;
      }
      if (kind === "this_month"){
        const y = now.getFullYear(), m = now.getMonth();
        const start = new Date(y, m, 1), end = new Date(y, m+1, 0);
        startDateEl.value = toYmd(start); endDateEl.value = toYmd(end); return;
      }
      if (kind === "last_30"){
        const end = new Date(now), start = new Date(now); start.setDate(start.getDate()-29);
        startDateEl.value = toYmd(start); endDateEl.value = toYmd(end); return;
      }
    }

    function refresh(){
      const mode = (sel.value === "weekday") ? "weekday" : "daily";
      let filtered = filterByDateRange(rawAll, startDateEl.value, endDateEl.value);
      filtered = filterByEmotion(filtered, selected);

      if (mode === "daily") renderListDailyDetailMobileFriendly(filtered);
      else renderListWeekdaySummary(filtered);

      const agg = aggregateHistory(filtered, mode);
      drawChart(agg, mode);
    }

    // --- 日付範囲フィルタ（両端含む） ---
    function filterByDateRange(items, startStr, endStr){
      if ((!startStr && !endStr) || items.length === 0) return items;
      const start = startStr ? new Date(startStr + "T00:00:00+09:00") : null;
      const end   = endStr   ? new Date(endStr   + "T23:59:59.999+09:00") : null;
      return items.filter(it => {
        const d = new Date(it.timestamp);
        if (isNaN(d.getTime())) return false;
        if (start && d < start) return false;
        if (end && d > end) return false;
        return true;
      });
    }

    // --- 感情フィルタ ---
    function filterByEmotion(items, selectedSet){
      if (!selectedSet || selectedSet.size === 0) return [];
      return items.filter(it => selectedSet.has(it.emotion));
    }

    // ===== モバイル向け：日ごとの折りたたみリスト =====
    function renderListDailyDetailMobileFriendly(raw){
      const grouped = {};
      raw.forEach(it => {
        const d = new Date(it.timestamp);
        if (isNaN(d.getTime())) return;
        const key = toLocalDateJST(d);
        (grouped[key] ||= []).push(it);
      });

      const keys = Object.keys(grouped).sort();
      list.innerHTML = "";
      if (keys.length === 0) {
        list.innerHTML = "<li>該当するデータがありません。</li>";
        return;
      }

      keys.forEach(k => {
        const arr = grouped[k].sort((a,b) => a.timestamp.localeCompare(b.timestamp));
        const total = arr.length;

        // details/summaryで折りたたみ（スマホは視線移動が少なくて見やすい）
        const li = document.createElement("li");
        const details = document.createElement("details");
        if (window.matchMedia("(min-width: 769px)").matches){
          details.open = true; // PCでは開いたまま
        }
        const summary = document.createElement("summary");
        summary.innerHTML = `<span class="caret">▶</span> <strong>${k}：${total}件</strong>`;
        const inner = document.createElement("div");
        inner.className = "list-inner";
        inner.innerHTML = arr.map(it => {
          const t = formatTimeJST(new Date(it.timestamp));
          return `<div>🕒 ${t}　${it.emotion}</div>`;
        }).join("");

        details.appendChild(summary);
        details.appendChild(inner);
        li.appendChild(details);
        list.appendChild(li);
      });
    }

    function renderListWeekdaySummary(raw){
      const wd = ["日","月","火","水","木","金","土"];
      const counts = Object.fromEntries(wd.map(w => [w, 0]));
      raw.forEach(it => {
        const d = new Date(it.timestamp);
        if (isNaN(d.getTime())) return;
        counts[wd[d.getDay()]]++;
      });

      list.innerHTML = "";
      const has = Object.values(counts).some(v => v > 0);
      if (!has) {
        list.innerHTML = "<li>該当するデータがありません。</li>";
        return;
      }
      wd.forEach(w => {
        if (counts[w] > 0) {
          const li = document.createElement("li");
          li.textContent = `${w}：${counts[w]}件`;
          list.appendChild(li);
        }
      });
    }

    function toLocalDateJST(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }
    function formatTimeJST(d){
      const pad = n => String(n).padStart(2,"0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function drawChart(data, mode){
      const labels = data.labels || [];
      const emotions = EMOTIONS;
      const datasets = emotions.map(emotion => ({
        label: emotion,
        backgroundColor: (window.colorMap && window.colorMap[emotion]) || "#999",
        data: (data.seriesByEmotion && data.seriesByEmotion[emotion])
                ? data.seriesByEmotion[emotion]
                : Array(labels.length).fill(0)
      }));

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false, // 親コンテナのheightに追従（メディアクエリで可変）
          scales: {
            y: { beginAtZero: true, min: 0, title: { display: true, text: "件数" } },
            x: { title: { display: true, text: (mode === "weekday") ? "曜日" : "日付" } }
          },
          plugins: {
            legend: { position: "bottom" },
            title: { display: true, text: (mode === "weekday") ? "曜日別感情分布" : "日別感情分布" }
          }
        }
      });
    }

    // 棒クリック→その日だけに絞る（スマホでもOK）
    document.getElementById("emotionChart").onclick = (evt)=>{
      if (!chart) return;
      const p = chart.getElementsAtEventForMode(evt, 'nearest', {intersect:true}, true);
      if (!p.length) return;
      const idx = p[0].index;
      const day = chart.data.labels[idx];
      sel.value = "date";
      startDateEl.value = day; endDateEl.value = day;
      refresh();
      document.getElementById("historyList")?.scrollIntoView({behavior:"smooth"});
    };
  </script>
</body>
</html>
